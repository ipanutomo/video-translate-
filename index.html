<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Local AI Video Subtitle Editor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body { background: #0b0e14; color: #e5e7eb; font-family: system-ui, -apple-system, sans-serif; }
    .card { background: #1e2430; border-radius: 16px; padding: 1rem; box-shadow: 0 8px 20px rgba(0,0,0,0.6); }
    .video-container { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; }
    video { width: 100%; display: block; }
    .subtitle-overlay { position: absolute; bottom: 60px; left: 0; right: 0; text-align: center; pointer-events: none; padding: 0 10px; }
    .subtitle-overlay span { background: rgba(0,0,0,0.7); padding: 6px 16px; border-radius: 30px; font-size: 1.1rem; display: inline-block; backdrop-filter: blur(4px); }
    .timeline { display: flex; gap: 4px; flex-wrap: nowrap; overflow-x: auto; padding: 8px 0; }
    .segment-block { flex: 0 0 auto; background: #2a3344; border-radius: 20px; padding: 4px 12px; font-size: 0.7rem; white-space: nowrap; border: 1px solid #3b465c; cursor: pointer; transition: 0.15s; }
    .segment-block.active { border-color: #60a5fa; background: #1e3a5f; }
    .btn { background: #2d3748; border: none; padding: 6px 14px; border-radius: 30px; color: #e5e7eb; font-size: 0.85rem; transition: 0.2s; cursor: pointer; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-success { background: #059669; color: white; }
    .btn-success:hover { background: #047857; }
    .btn-danger { background: #b91c1c; color: white; }
    .btn-danger:hover { background: #991b1b; }
    .btn-outline { background: transparent; border: 1px solid #4b5a74; }
    .btn-sm { padding: 4px 10px; font-size: 0.75rem; }
    .btn-xs { padding: 2px 8px; font-size: 0.65rem; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .segment-row { background: #1a212c; border-radius: 12px; padding: 8px 12px; margin-bottom: 6px; border-left: 4px solid #3b465c; }
    .segment-row.active-seg { border-left-color: #60a5fa; background: #1e2a3a; }
    .segment-row.processing { border-left-color: #f59e0b; background: #1e2a1a; }
    input, textarea, select { background: #0f151e; border: 1px solid #2d3748; color: #e5e7eb; border-radius: 10px; padding: 6px 10px; width: 100%; font-size: 0.85rem; }
    input:focus, textarea:focus { outline: 2px solid #2563eb; border-color: transparent; }
    label { font-size: 0.7rem; color: #9ca3af; }
    .tab-btn { background: transparent; border: none; padding: 8px 16px; color: #9ca3af; border-bottom: 2px solid transparent; font-weight: 500; cursor: pointer; }
    .tab-btn.active { color: white; border-bottom-color: #2563eb; }
    @media (max-width: 740px) { .grid-2col { grid-template-columns: 1fr; } }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #1a212c; }
    ::-webkit-scrollbar-thumb { background: #3b465c; border-radius: 10px; }
    .api-select { background: #0f151e; border: 1px solid #2d3748; color: #e5e7eb; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #2563eb; border-radius: 50%; border-top-color: transparent; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-bar { padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; margin-top: 6px; }
    .status-success { background: #064e3b; color: #6ee7b7; }
    .status-error { background: #7f1d1d; color: #fca5a5; }
    .status-info { background: #1e3a5f; color: #93c5fd; }
    .status-progress { background: #78350f; color: #fcd34d; }
    .api-section { border: 1px solid #2d3748; border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; }
    .api-section .label { font-size: 0.7rem; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; }
    .time-input { width: 70px; display: inline-block; }
    .time-input input { width: 100%; padding: 2px 6px; font-size: 0.75rem; }
    .copy-btn { background: transparent; border: none; color: #60a5fa; cursor: pointer; padding: 2px 6px; font-size: 0.7rem; }
    .copy-btn:hover { color: #93c5fd; }
    .copy-btn.copied { color: #34d399; }
  </style>
</head>
<body>

<div class="max-w-7xl mx-auto p-3 md:p-5" id="app">
  <!-- HEADER -->
  <header class="flex flex-wrap items-center justify-between gap-2 mb-4">
    <h1 class="text-xl font-bold flex items-center gap-2"><i class="fas fa-film text-blue-400"></i> Subtitle AI <span class="text-sm font-normal text-gray-400">(Cina → Indonesia)</span></h1>
    <div class="flex flex-wrap gap-2">
      <button class="btn btn-primary" onclick="document.getElementById('videoInput').click()"><i class="fas fa-video mr-1"></i> Buka Video</button>
      <input type="file" id="videoInput" accept="video/*" class="hidden" onchange="loadVideo(event)">
      <button class="btn btn-outline" onclick="importSRT()"><i class="fas fa-file-import mr-1"></i> Import SRT</button>
      <button class="btn btn-outline" onclick="exportSRT('original')"><i class="fas fa-download mr-1"></i> Export SRT</button>
      <button class="btn btn-outline" onclick="saveProject()"><i class="fas fa-save mr-1"></i> Save</button>
      <button class="btn btn-outline" onclick="loadProject()"><i class="fas fa-folder-open mr-1"></i> Load</button>
    </div>
  </header>

  <!-- MAIN LAYOUT -->
  <div class="grid md:grid-cols-5 gap-4">
    <!-- LEFT: Video + timeline -->
    <div class="md:col-span-3 space-y-3">
      <div class="card video-container">
        <video id="videoPlayer" controls playsinline preload="metadata"></video>
        <div id="subtitleOverlay" class="subtitle-overlay"><span id="overlayText">[Subtitle]</span></div>
        <div class="flex flex-wrap items-center gap-2 p-2 bg-[#141b26] text-sm">
          <button onclick="togglePlay()" class="btn btn-sm"><i class="fas fa-play" id="playIcon"></i></button>
          <span id="timeDisplay" class="text-xs font-mono">00:00 / 00:00</span>
          <select id="speedControl" onchange="setSpeed(this.value)" class="bg-[#0f151e] border border-[#2d3748] rounded-lg px-2 py-1 text-xs">
            <option value="0.5">0.5x</option><option value="0.75">0.75x</option><option value="1" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option>
          </select>
          <button class="btn btn-sm btn-outline" onclick="setCurrentTime()"><i class="fas fa-clock mr-1"></i> Set Waktu</button>
          <span class="text-xs text-gray-400 ml-auto">Overlay:</span>
          <button class="btn btn-sm" onclick="setOverlay('original')">Original</button>
          <button class="btn btn-sm" onclick="setOverlay('translation')">Translation</button>
          <button class="btn btn-sm btn-primary" onclick="setOverlay('both')">Both</button>
        </div>
      </div>
      <div class="card">
        <div class="flex justify-between items-center mb-1"><span class="text-xs font-semibold">Timeline Segmen</span><span id="segCount" class="text-xs text-gray-400">0 segmen</span></div>
        <div id="timelineContainer" class="timeline"></div>
      </div>
    </div>

    <!-- RIGHT: Tabs -->
    <div class="md:col-span-2 space-y-3">
      <div class="card">
        <div class="flex border-b border-[#2d3748] mb-2">
          <button class="tab-btn active" data-tab="step1" onclick="switchTab('step1')"><i class="fas fa-edit mr-1"></i> Step 1: Segmentasi</button>
          <button class="tab-btn" data-tab="step2" onclick="switchTab('step2')"><i class="fas fa-language mr-1"></i> Step 2: Terjemahan</button>
        </div>
        <!-- Step 1 -->
        <div id="step1Panel">
          <div class="flex flex-wrap gap-2 mb-3">
            <button class="btn btn-sm btn-primary" onclick="addSegment()"><i class="fas fa-plus mr-1"></i> Tambah</button>
            <button class="btn btn-sm btn-outline" onclick="splitSegment()"><i class="fas fa-cut mr-1"></i> Split</button>
            <button class="btn btn-sm btn-outline" onclick="mergeSegments()"><i class="fas fa-object-group mr-1"></i> Merge</button>
            <button class="btn btn-sm btn-danger" onclick="deleteSelected()"><i class="fas fa-trash mr-1"></i> Hapus</button>
            <button class="btn btn-sm btn-success" onclick="transcribeSelected()"><i class="fas fa-microphone mr-1"></i> Transkripsi</button>
          </div>
          
          <!-- API Key untuk Transkripsi (Groq Whisper) -->
          <div class="api-section">
            <div class="label"><i class="fas fa-microphone mr-1"></i> API Key Transkripsi (Groq Whisper)</div>
            <input id="transcribeApiKey" type="password" placeholder="Masukkan Groq API Key" class="text-sm" />
            <div class="text-xs text-gray-500 mt-1">Dapatkan gratis di <a href="https://console.groq.com" target="_blank" class="text-blue-400">console.groq.com</a></div>
          </div>
          
          <div id="segmentList" class="max-h-[300px] overflow-y-auto space-y-1 pr-1"></div>
        </div>
        <!-- Step 2 -->
        <div id="step2Panel" class="hidden">
          <div class="flex flex-wrap gap-2 mb-2">
            <button class="btn btn-sm btn-primary" onclick="selectAllSegments(true)"><i class="fas fa-check-double mr-1"></i> Pilih Semua</button>
            <button class="btn btn-sm btn-outline" onclick="selectAllSegments(false)"><i class="fas fa-times mr-1"></i> Batal</button>
          </div>
          
          <!-- API Key untuk Terjemahan -->
          <div class="api-section">
            <div class="label"><i class="fas fa-language mr-1"></i> API Key Terjemahan</div>
            <div class="flex gap-2">
              <select id="translateApiSelect" class="api-select rounded-lg p-1 text-sm flex-1">
                <option value="gemini">Google Gemini</option>
                <option value="groq">Groq (LLM)</option>
                <option value="openrouter">OpenRouter</option>
              </select>
              <input id="translateApiKey" type="password" placeholder="API Key" class="text-sm flex-1" />
            </div>
          </div>
          
          <button class="btn btn-primary w-full" id="translateBtn" onclick="translateSelected()"><i class="fas fa-language mr-1"></i> Terjemahkan yang Dipilih</button>
          <div id="translationStatus" class="text-xs mt-2"></div>
        </div>
      </div>
      <div class="flex gap-2">
        <button class="btn btn-outline flex-1" onclick="exportSRT('original')"><i class="fas fa-file-alt mr-1"></i> Original SRT</button>
        <button class="btn btn-primary flex-1" onclick="exportSRT('translation')"><i class="fas fa-file-export mr-1"></i> Translation SRT</button>
      </div>
    </div>
  </div>
</div>

<script>
  // ========== STATE ==========
  let segments = [];
  let videoFile = null;
  let videoURL = null;
  let overlayMode = 'both';
  let currentSegId = null;
  let segCounter = 0;
  let isProcessing = false;

  const video = document.getElementById('videoPlayer');
  const overlayText = document.getElementById('overlayText');
  const timeDisplay = document.getElementById('timeDisplay');
  const playIcon = document.getElementById('playIcon');
  const segmentListEl = document.getElementById('segmentList');
  const timelineEl = document.getElementById('timelineContainer');
  const segCountEl = document.getElementById('segCount');
  const statusEl = document.getElementById('translationStatus');

  // ========== AUTOSAVE ==========
  function autosave() {
    const data = { segments, overlayMode, segCounter };
    localStorage.setItem('subtitleEditorProject', JSON.stringify(data));
  }

  // ========== VIDEO ==========
  function loadVideo(e) {
    const file = e.target.files[0];
    if (!file) return;
    videoFile = file;
    if (videoURL) URL.revokeObjectURL(videoURL);
    videoURL = URL.createObjectURL(file);
    video.src = videoURL;
    video.load();
    video.onloadedmetadata = () => {
      timeDisplay.textContent = formatTime(0) + ' / ' + formatTime(video.duration);
    };
    autosave();
  }

  function togglePlay() {
    if (video.paused) video.play(); else video.pause();
  }
  video.onplay = () => playIcon.className = 'fas fa-pause';
  video.onpause = () => playIcon.className = 'fas fa-play';
  video.ontimeupdate = () => {
    timeDisplay.textContent = formatTime(video.currentTime) + ' / ' + formatTime(video.duration);
    updateOverlay();
    updateTimelineHighlight();
  };
  function setSpeed(val) { video.playbackRate = parseFloat(val); }
  function setCurrentTime() {
    const seg = segments.find(s => s.id === currentSegId);
    if (seg) {
      video.currentTime = seg.start;
    }
  }

  function formatTime(t) {
    if (!t || isNaN(t)) return '00:00';
    const m = Math.floor(t/60);
    const s = Math.floor(t%60);
    return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }

  function parseTimeInput(str) {
    const parts = str.split(':');
    if (parts.length === 2) {
      return parseFloat(parts[0])*60 + parseFloat(parts[1]);
    }
    return parseFloat(str) || 0;
  }

  // ========== OVERLAY ==========
  function setOverlay(mode) { overlayMode = mode; updateOverlay(); }
  function updateOverlay() {
    const ct = video.currentTime;
    let seg = segments.find(s => ct >= s.start && ct < s.end);
    if (!seg) { overlayText.textContent = ''; return; }
    let parts = [];
    if (overlayMode === 'original' || overlayMode === 'both') parts.push(seg.original || '');
    if (overlayMode === 'translation' || overlayMode === 'both') parts.push(seg.translation || '');
    overlayText.textContent = parts.filter(p => p).join(' | ') || '[Teks kosong]';
  }

  // ========== SEGMENT CRUD ==========
  function addSegment(start, end, original, translation) {
    const id = ++segCounter;
    const seg = {
      id,
      start: start !== undefined ? start : (video.currentTime || 0),
      end: end !== undefined ? end : (video.currentTime || 0) + 3,
      original: original || '',
      translation: translation || '',
      selected: false
    };
    segments.push(seg);
    renderAll();
    autosave();
    return seg;
  }

  function deleteSelected() {
    segments = segments.filter(s => !s.selected);
    if (segments.length === 0) segCounter = 0;
    renderAll();
    autosave();
  }

  function splitSegment() {
    const time = video.currentTime;
    const idx = segments.findIndex(s => time > s.start && time < s.end);
    if (idx === -1) return alert('Posisi video harus berada di dalam segmen untuk split.');
    const seg = segments[idx];
    const newSeg = {
      id: ++segCounter,
      start: time,
      end: seg.end,
      original: seg.original || '',
      translation: seg.translation || '',
      selected: false
    };
    seg.end = time;
    segments.splice(idx+1, 0, newSeg);
    renderAll();
    autosave();
  }

  function mergeSegments() {
    const selected = segments.filter(s => s.selected);
    if (selected.length < 2) return alert('Pilih minimal 2 segmen untuk merge.');
    const sorted = [...selected].sort((a,b) => a.start - b.start);
    const first = sorted[0];
    const last = sorted[sorted.length-1];
    const merged = {
      id: ++segCounter,
      start: first.start,
      end: last.end,
      original: sorted.map(s => s.original).filter(t=>t).join(' '),
      translation: sorted.map(s => s.translation).filter(t=>t).join(' '),
      selected: false
    };
    const ids = new Set(sorted.map(s => s.id));
    segments = segments.filter(s => !ids.has(s.id));
    segments.push(merged);
    renderAll();
    autosave();
  }

  function toggleSelectSegment(id) {
    const seg = segments.find(s => s.id === id);
    if (seg) seg.selected = !seg.selected;
    renderAll();
  }

  function selectAllSegments(val) {
    segments.forEach(s => s.selected = val);
    renderAll();
  }

  function deleteSegment(id) {
    segments = segments.filter(s => s.id !== id);
    if (segments.length === 0) segCounter = 0;
    renderAll();
    autosave();
  }

  function updateText(id, field, value) {
    const seg = segments.find(s => s.id === id);
    if (seg) { seg[field] = value; autosave(); }
  }

  function updateTime(id, field, value) {
    const seg = segments.find(s => s.id === id);
    if (seg) {
      const t = parseTimeInput(value);
      if (!isNaN(t) && t >= 0) {
        seg[field] = t;
        if (seg.start >= seg.end) {
          seg.end = seg.start + 1;
        }
        renderAll();
        autosave();
      }
    }
  }

  function setCurrentSeg(id) {
    currentSegId = id;
    const seg = segments.find(s => s.id === id);
    if (seg) video.currentTime = seg.start;
    renderAll();
  }

  // ========== COPY FUNCTION ==========
  function copyText(id, field) {
    const seg = segments.find(s => s.id === id);
    if (!seg) return;
    const text = seg[field] || '';
    if (!text) {
      // Feedback singkat
      const btn = document.querySelector(`.copy-btn[data-id="${id}"][data-field="${field}"]`);
      if (btn) {
        btn.textContent = '📭';
        setTimeout(() => { btn.innerHTML = '<i class="fas fa-copy"></i>'; }, 1000);
      }
      return;
    }
    
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.querySelector(`.copy-btn[data-id="${id}"][data-field="${field}"]`);
      if (btn) {
        btn.innerHTML = '✅';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.innerHTML = '<i class="fas fa-copy"></i>';
          btn.classList.remove('copied');
        }, 1500);
      }
    }).catch(() => {
      // Fallback: select + copy manual
      const textarea = document.createElement('textarea');
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      
      const btn = document.querySelector(`.copy-btn[data-id="${id}"][data-field="${field}"]`);
      if (btn) {
        btn.innerHTML = '✅';
        setTimeout(() => { btn.innerHTML = '<i class="fas fa-copy"></i>'; }, 1500);
      }
    });
  }

  // ========== RENDER ==========
  function renderAll() {
    renderSegmentList();
    renderTimeline();
    segCountEl.textContent = segments.length + ' segmen';
    updateOverlay();
  }

  function renderSegmentList() {
    let html = '';
    segments.forEach(seg => {
      const active = currentSegId === seg.id ? 'active-seg' : '';
      const processing = seg._processing ? 'processing' : '';
      html += `
        <div class="segment-row ${active} ${processing}" onclick="setCurrentSeg(${seg.id})">
          <div class="flex flex-wrap items-center gap-1 text-xs">
            <input type="checkbox" ${seg.selected?'checked':''} onclick="event.stopPropagation(); toggleSelectSegment(${seg.id})" class="w-4 h-4 accent-blue-500">
            <span class="text-gray-400 text-[10px]">#${seg.id}</span>
            <div class="time-input"><input type="text" value="${formatTime(seg.start)}" onchange="updateTime(${seg.id}, 'start', this.value)" onclick="event.stopPropagation()" class="text-[10px] p-0 px-1" /></div>
            <span class="text-gray-500">→</span>
            <div class="time-input"><input type="text" value="${formatTime(seg.end)}" onchange="updateTime(${seg.id}, 'end', this.value)" onclick="event.stopPropagation()" class="text-[10px] p-0 px-1" /></div>
            <button class="btn btn-sm btn-outline" onclick="event.stopPropagation(); deleteSegment(${seg.id})"><i class="fas fa-times text-red-400 text-[10px]"></i></button>
            ${seg._processing ? '<span class="spinner" style="width:12px;height:12px;"></span>' : ''}
          </div>
          <div class="grid grid-cols-2 gap-1 mt-1">
            <div class="flex items-center gap-1">
              <input type="text" placeholder="Original (Cina)" value="${escHtml(seg.original)}" onchange="updateText(${seg.id}, 'original', this.value)" class="text-xs flex-1">
              <button class="copy-btn" data-id="${seg.id}" data-field="original" onclick="event.stopPropagation(); copyText(${seg.id}, 'original')" title="Copy teks Original"><i class="fas fa-copy"></i></button>
            </div>
            <div class="flex items-center gap-1">
              <input type="text" placeholder="Translation (Indonesia)" value="${escHtml(seg.translation)}" onchange="updateText(${seg.id}, 'translation', this.value)" class="text-xs flex-1">
              <button class="copy-btn" data-id="${seg.id}" data-field="translation" onclick="event.stopPropagation(); copyText(${seg.id}, 'translation')" title="Copy teks Translation"><i class="fas fa-copy"></i></button>
            </div>
          </div>
        </div>
      `;
    });
    segmentListEl.innerHTML = html || '<div class="text-gray-500 text-sm p-2">Belum ada segmen. Tambahkan segmen.</div>';
  }

  function renderTimeline() {
    if (!video.duration) { timelineEl.innerHTML = ''; return; }
    let html = '';
    const total = video.duration || 1;
    segments.forEach(seg => {
      const left = (seg.start / total) * 100;
      const width = ((seg.end - seg.start) / total) * 100;
      const active = currentSegId === seg.id ? 'active' : '';
      html += `<div class="segment-block ${active}" style="margin-left:${left}%; width:${Math.max(width,2)}%;" onclick="setCurrentSeg(${seg.id})">${formatTime(seg.start)}</div>`;
    });
    timelineEl.innerHTML = html || '<span class="text-gray-500 text-xs">Tidak ada segmen</span>';
  }

  function updateTimelineHighlight() {
    document.querySelectorAll('.segment-block').forEach(el => el.classList.remove('active'));
    const ct = video.currentTime;
    const seg = segments.find(s => ct >= s.start && ct < s.end);
    if (seg) {
      currentSegId = seg.id;
      renderAll();
    }
  }

  function escHtml(str) { return str.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ========== TRANSCRIPTION with WebCodecs ==========
  async function transcribeSelected() {
    if (isProcessing) return;
    if (!videoFile) return alert('Upload video terlebih dahulu.');

    const selected = segments.filter(s => s.selected);
    if (selected.length === 0) {
      alert('Pilih segmen yang akan ditranskripsi (centang checkbox).');
      return;
    }

    const key = document.getElementById('transcribeApiKey').value.trim();
    if (!key) return alert('Masukkan Groq API Key untuk transkripsi.');

    // Cek dukungan WebCodecs
    if (!('AudioDecoder' in window) || !('VideoDecoder' in window)) {
      alert('Browser Anda tidak mendukung WebCodecs. Gunakan Chrome/Edge terbaru.');
      return;
    }

    isProcessing = true;
    let successCount = 0;
    let failCount = 0;

    for (let seg of selected) {
      seg._processing = true;
      renderAll();
      try {
        const audioBlob = await extractAudioWithWebCodecs(seg.start, seg.end);
        const transcribed = await transcribeAudio(audioBlob, key);
        seg.original = transcribed;
        seg._processing = false;
        successCount++;
        renderAll();
      } catch (error) {
        seg._processing = false;
        seg.original = `[Error: ${error.message}]`;
        failCount++;
        renderAll();
      }
      await sleep(500);
    }

    isProcessing = false;
    setStatus(`✅ Transkripsi selesai: ${successCount} berhasil, ${failCount} gagal.`, successCount > 0 ? 'success' : 'error');
    autosave();
  }

  async function extractAudioWithWebCodecs(start, end) {
    return new Promise(async (resolve, reject) => {
      try {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createBufferSource();
        
        const response = await fetch(videoURL);
        const arrayBuffer = await response.arrayBuffer();
        const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
        
        const sampleRate = audioBuffer.sampleRate;
        const startSample = Math.floor(start * sampleRate);
        const endSample = Math.floor(end * sampleRate);
        const length = endSample - startSample;
        
        const channels = audioBuffer.numberOfChannels;
        const newBuffer = audioContext.createBuffer(channels, length, sampleRate);
        
        for (let ch = 0; ch < channels; ch++) {
          const channelData = audioBuffer.getChannelData(ch);
          const newChannelData = newBuffer.getChannelData(ch);
          for (let i = 0; i < length; i++) {
            if (startSample + i < channelData.length) {
              newChannelData[i] = channelData[startSample + i];
            }
          }
        }
        
        const wavBlob = bufferToWav(newBuffer);
        resolve(wavBlob);
      } catch (error) {
        reject(new Error(`Gagal ekstrak audio: ${error.message}`));
      }
    });
  }

  function bufferToWav(buffer) {
    const numChannels = buffer.numberOfChannels;
    const sampleRate = buffer.sampleRate;
    const format = 1;
    const bitDepth = 16;
    const bytesPerSample = bitDepth / 8;
    const blockAlign = numChannels * bytesPerSample;
    const samples = buffer.length;
    const dataSize = samples * blockAlign;
    const headerSize = 44;
    const totalSize = headerSize + dataSize;

    const wav = new ArrayBuffer(totalSize);
    const view = new DataView(wav);

    writeString(view, 0, 'RIFF');
    view.setUint32(4, totalSize - 8, true);
    writeString(view, 8, 'WAVE');
    writeString(view, 12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, format, true);
    view.setUint16(22, numChannels, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * blockAlign, true);
    view.setUint16(32, blockAlign, true);
    view.setUint16(34, bitDepth, true);
    writeString(view, 36, 'data');
    view.setUint32(40, dataSize, true);

    let offset = 44;
    for (let i = 0; i < samples; i++) {
      for (let ch = 0; ch < numChannels; ch++) {
        const sample = Math.max(-1, Math.min(1, buffer.getChannelData(ch)[i] || 0));
        const intSample = Math.floor(sample * 32767);
        view.setInt16(offset, intSample, true);
        offset += 2;
      }
    }

    return new Blob([wav], { type: 'audio/wav' });
  }

  function writeString(view, offset, string) {
    for (let i = 0; i < string.length; i++) {
      view.setUint8(offset + i, string.charCodeAt(i));
    }
  }

  async function transcribeAudio(audioBlob, apiKey) {
    const formData = new FormData();
    formData.append('file', audioBlob, 'segment.wav');
    formData.append('model', 'whisper-large-v3');
    formData.append('language', 'zh');
    formData.append('response_format', 'text');

    const response = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${apiKey}`
      },
      body: formData
    });

    if (!response.ok) {
      const err = await response.text();
      throw new Error(`Groq API error: ${response.status} - ${err}`);
    }

    const text = await response.text();
    return text.trim();
  }

  // ========== TRANSLATION API ==========
  async function translateSelected() {
    if (isProcessing) return;
    const selected = segments.filter(s => s.selected);
    if (selected.length === 0) {
      setStatus('Pilih segmen yang akan diterjemahkan.', 'error');
      return;
    }
    const api = document.getElementById('translateApiSelect').value;
    const key = document.getElementById('translateApiKey').value.trim();
    if (!key) {
      setStatus('Masukkan API Key terjemahan.', 'error');
      return;
    }

    isProcessing = true;
    document.getElementById('translateBtn').disabled = true;
    setStatus('⏳ Menerjemahkan...', 'info');

    let successCount = 0;
    let failCount = 0;

    for (let seg of selected) {
      if (!seg.original || seg.original.trim() === '') {
        seg.translation = '[Teks kosong]';
        continue;
      }
      try {
        const translated = await callTranslationAPI(api, key, seg.original);
        seg.translation = translated;
        successCount++;
        renderAll();
      } catch (error) {
        failCount++;
        seg.translation = `[Error: ${error.message}]`;
        renderAll();
      }
      await sleep(300);
    }

    isProcessing = false;
    document.getElementById('translateBtn').disabled = false;
    setStatus(`✅ Selesai: ${successCount} berhasil, ${failCount} gagal.`, successCount > 0 ? 'success' : 'error');
    autosave();
  }

async function callTranslationAPI(api, key, text) {
    const prompt = `Terjemahkan teks bahasa Cina berikut ke bahasa Indonesia. Berikan hanya terjemahannya, tanpa penjelasan tambahan.\n\nTeks: ${text}`;[cite: 2]

    let url, body, headers;[cite: 2]

    switch (api) {
      case 'gemini': {
        // Menggunakan model Gemini 2.5 Flash yang aktif
        url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`;
        body = {
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { temperature: 0.3, maxOutputTokens: 256 }
        };[cite: 2]
        headers = { 'Content-Type': 'application/json' };[cite: 2]
        const response = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) });[cite: 2]
        if (!response.ok) {
          const err = await response.text();[cite: 2]
          throw new Error(`Gemini API error: ${response.status} - ${err}`);[cite: 2]
        }
        const data = await response.json();[cite: 2]
        return data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || '';[cite: 2]
      }
      case 'groq': {
        url = 'https://api.groq.com/openai/v1/chat/completions';[cite: 2]
        body = {
          model: 'llama-3.3-70b-versatile',
          messages: [
            { role: 'system', content: 'Kamu adalah penerjemah bahasa Cina ke Indonesia. Berikan hanya terjemahan.' },
            { role: 'user', content: prompt }
          ],
          temperature: 0.3,
          max_tokens: 256
        };[cite: 2]
        headers = {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${key}`
        };[cite: 2]
        const response = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) });[cite: 2]
        if (!response.ok) {
          const err = await response.text();[cite: 2]
          throw new Error(`Groq API error: ${response.status} - ${err}`);[cite: 2]
        }
        const data = await response.json();[cite: 2]
        return data?.choices?.[0]?.message?.content?.trim() || '';[cite: 2]
      }
      case 'openrouter': {
        url = 'https://openrouter.ai/api/v1/chat/completions';[cite: 2]
        body = {
          // Menggunakan model Gemini 2.5 Flash di OpenRouter
          model: 'google/gemini-2.5-flash',
          messages: [
            { role: 'system', content: 'Kamu adalah penerjemah bahasa Cina ke Indonesia. Berikan hanya terjemahan.' },
            { role: 'user', content: prompt }
          ],
          temperature: 0.3,
          max_tokens: 256
        };[cite: 2]
        headers = {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${key}`,
          'HTTP-Referer': window.location.href,
          'X-Title': 'Local Subtitle Editor'
        };[cite: 2]
        const response = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) });[cite: 2]
        if (!response.ok) {
          const err = await response.text();[cite: 2]
          throw new Error(`OpenRouter API error: ${response.status} - ${err}`);[cite: 2]
        }
        const data = await response.json();[cite: 2]
        return data?.choices?.[0]?.message?.content?.trim() || '';[cite: 2]
      }
      default:
        throw new Error('API tidak dikenal');[cite: 2]
    }
  }
  }

  function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

  function setStatus(msg, type = 'info') {
    statusEl.textContent = msg;
    statusEl.className = `text-xs mt-2 status-bar status-${type}`;
    if (!msg) statusEl.className = 'text-xs mt-2';
  }

  // ========== EXPORT SRT ==========
  function exportSRT(type) {
    if (segments.length === 0) return alert('Tidak ada segmen.');
    let srt = '';
    let idx = 1;
    segments.forEach(seg => {
      const text = type === 'original' ? seg.original : seg.translation;
      if (!text || text.trim() === '') return;
      srt += `${idx}\n${formatTimeSRT(seg.start)} --> ${formatTimeSRT(seg.end)}\n${text.trim()}\n\n`;
      idx++;
    });
    if (!srt) return alert('Tidak ada teks untuk diekspor.');
    const blob = new Blob([srt], {type: 'text/plain;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `subtitle_${type}.srt`;
    a.click();
  }

  function formatTimeSRT(t) {
    const h = Math.floor(t/3600);
    const m = Math.floor((t%3600)/60);
    const s = Math.floor(t%60);
    const ms = Math.floor((t%1)*1000);
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')},${String(ms).padStart(3,'0')}`;
  }

  // ========== IMPORT SRT ==========
  function importSRT() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.srt,.txt';
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        parseSRT(ev.target.result);
      };
      reader.readAsText(file);
    };
    input.click();
  }

  function parseSRT(text) {
    const blocks = text.trim().split(/\n\s*\n/);
    segments = [];
    segCounter = 0;
    blocks.forEach(block => {
      const lines = block.split('\n').filter(l => l.trim());
      if (lines.length < 3) return;
      const timeLine = lines.find(l => l.includes('-->'));
      if (!timeLine) return;
      const times = timeLine.split('-->').map(t => t.trim());
      const start = parseSRTTime(times[0]);
      const end = parseSRTTime(times[1]);
      const textContent = lines.slice(lines.indexOf(timeLine)+1).join(' ');
      if (!isNaN(start) && !isNaN(end)) {
        addSegment(start, end, textContent, '');
      }
    });
    renderAll();
    autosave();
  }

  function parseSRTTime(str) {
    const parts = str.replace(',', '.').split(':');
    if (parts.length === 3) {
      return parseFloat(parts[0])*3600 + parseFloat(parts[1])*60 + parseFloat(parts[2]);
    }
    return NaN;
  }

  // ========== SAVE / LOAD PROJECT ==========
  function saveProject() {
    const data = { segments, overlayMode, segCounter };
    localStorage.setItem('subtitleEditorProject', JSON.stringify(data));
    alert('Project tersimpan di localStorage.');
  }

  function loadProject() {
    const raw = localStorage.getItem('subtitleEditorProject');
    if (!raw) return alert('Tidak ada project tersimpan.');
    try {
      const data = JSON.parse(raw);
      segments = data.segments || [];
      overlayMode = data.overlayMode || 'both';
      segCounter = data.segCounter || 0;
      renderAll();
      autosave();
      alert('Project dimuat.');
    } catch(e) { alert('Gagal load project.'); }
  }

  // ========== TAB SWITCH ==========
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('active');
    document.getElementById('step1Panel').classList.toggle('hidden', tab !== 'step1');
    document.getElementById('step2Panel').classList.toggle('hidden', tab !== 'step2');
  }

  // ========== INIT ==========
  (function init() {
    const raw = localStorage.getItem('subtitleEditorProject');
    if (raw) {
      try {
        const data = JSON.parse(raw);
        segments = data.segments || [];
        overlayMode = data.overlayMode || 'both';
        segCounter = data.segCounter || 0;
        renderAll();
      } catch(e) {}
    }
    if (segments.length === 0) {
      addSegment(0, 5, '你好，世界', 'Halo dunia');
      addSegment(6, 10, '这是一个测试', 'Ini adalah tes');
      renderAll();
    }
    
    const savedTranscribeKey = localStorage.getItem('transcribeApiKey');
    if (savedTranscribeKey) document.getElementById('transcribeApiKey').value = savedTranscribeKey;
    document.getElementById('transcribeApiKey').addEventListener('change', function() {
      localStorage.setItem('transcribeApiKey', this.value);
    });
    
    const savedTranslateKey = localStorage.getItem('translateApiKey');
    if (savedTranslateKey) document.getElementById('translateApiKey').value = savedTranslateKey;
    document.getElementById('translateApiKey').addEventListener('change', function() {
      localStorage.setItem('translateApiKey', this.value);
    });
  })();
</script>
